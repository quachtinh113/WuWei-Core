# 1. Thiên thời - State Detection Engine
regime:
  adx_period: 14
  chop_period: 14
  atr_period: 14
  atr_sma_period: 50
  # Trạng thái VÔ VI (NO_TREND): Khóa toàn bộ lệnh mở mới khi nén biên độ / chop
  adx_no_trend_threshold: 20.0
  chop_no_trend_threshold: 61.8
  # Trạng thái KÍCH HOẠT XU HƯỚNG: Chỉ vào lệnh khi xu hướng rõ nét
  adx_trend_threshold: 25.0
  chop_trend_threshold: 38.2

# 2. Thuận dòng - Signal Generator Engine
signal:
  entry_channel_period: 20      # Donchian Breakout 20 bars
  exit_channel_period: 10       # Donchian Exit 10 bars ngược chiều

# 3. Tri chỉ - Volatility Targeting & Money Management Engine
risk:
  initial_capital: 100000.0
  risk_per_trade_pct: 0.01       # 1.0% rủi ro cho mỗi lệnh
  atr_period: 20                 # Đơn vị biến động N = ATR(20)
  stop_loss_atr_mult: 2.0        # Hard Stop Loss = Entry ± 2.0 * N
  max_daily_drawdown_pct: 0.03   # Circuit Breaker: 3.0% Max Daily Drawdown
  max_total_drawdown_pct: 0.06   # 6.0% Max Total Drawdown Limit
  max_open_trades_per_symbol: 1  # Không mở quá 1 lệnh đồng thời trên 1 cặp
  allow_dca: false               # Nghiêm cấm DCA nhồi lệnh âm
  allow_martingale: false        # Nghiêm cấm Martingale gấp thếp
  allow_hedge: false             # Nghiêm cấm Hedging đối ứng
  # Dynamic Stagnation Time-Stop & Pre-Weekend De-risking (Dead Capital Guard)
  time_stop_enabled: true
  time_stop_max_hours: 48
  time_stop_min_profit_atr: 0.5
  time_stop_friday_derisk: true

# 4. Hành vô vi - Execution & Trailing Exit Engine
execution:
  trailing_mode: "DONCHIAN_10"   # "DONCHIAN_10" hoặc "CHANDELIER"
  chandelier_atr_mult: 3.0
  breakeven_atr_trigger: 2.0     # Dời SL về hòa vốn khi giá chạy được +2.0 * N
  breakeven_buffer_pips: 1.0     # Buffer bù đắp trượt giá & phí hoa hồng

# 4.1. pysystemtrade (Robert Carver) Institutional Quantitative Engine
carver:
  enabled: true                  # Sử dụng định lượng Carver kết hợp Vô Vi
  annual_vol_target: 0.20        # 20.0% Portfolio Annual Volatility
  average_absolute_forecast: 10.0
  forecast_cap: 20.0             # Giới hạn cực đại Forecast [-20.0, +20.0]
  buffer_ratio: 0.10             # Độ rộng Buffer 10% để triệt tiêu giao dịch vi tế
  volatility_lookback_days: 35   # Chu kỳ EWMA ước lượng biến động giá
  fdm: 1.25                      # Forecast Diversification Multiplier
  idm: 1.35                      # Instrument Diversification Multiplier
  deleveraging_dd_threshold: 0.015 # Hạ đòn bẩy khi DD vượt 1.5%

# 5. Backtest Configuration
backtest:
  initial_cash: 100000.0
  default_symbol: "XAUUSD"
  generate_synthetic_if_missing: true
  start_date: "2024-01-01"
  end_date: "2024-12-31"
